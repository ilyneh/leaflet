name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
        -Dorg.gradle.parallel=true
        -Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx2g
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v6
        with:
          path: ~/.robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: >
          ./gradlew testDebugUnitTest
          :core:phloem:test
          :core:network:plants:test
          :core:network:client:test
          :core:time:test

      - name: Summarize test failures
        if: failure()
        run: python3 ci_scripts/summarize_test_failures.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
